name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you typed, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Distribution, desktop or compositor, Fcitx5 version, the application you typed into, Bornopata version or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log output if you have it. Remove anything private.
