# Builds and checks the Windows shell (the Server and the text service DLL) on a Windows machine, and, when run by hand,
# builds the installer and keeps it as an artifact to download and try. The Linux CI job cannot do this: the Windows parts
# only compile on Windows or cross-compile, and nothing of them can run elsewhere. Windows minutes cost double, so it
# runs only for changes that can matter to Windows.
name: windows

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/settings/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/windows-fetch-data.sh"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      installer:
        description: "Also build the installer and keep it as an artifact"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.96.0
          components: clippy
          # The installer carries a 32 bit DLL too, for 32 bit applications.
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy -p borno-windows-server -p borno-windows-tsf -p borno-server -p borno-window --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p borno-windows-server -p borno-windows-tsf -p borno-server -p borno-window --locked

      - name: Check the 32 bit DLL
        run: cargo check -p borno-windows-tsf --target i686-pc-windows-msvc --locked

      # Only when asked for by hand, or for a Windows tag: the data and the installer.
      - name: Fetch the data
        if: github.event_name == 'workflow_dispatch' && inputs.installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/windows-fetch-data.sh

      # The same version as the development machines. The installer file is pinned by checksum, taken from the release page.
      - name: Install Inno Setup 7.1.0
        if: github.event_name == 'workflow_dispatch' && inputs.installer
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup installer checksum differs: $actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build the installer
        if: github.event_name == 'workflow_dispatch' && inputs.installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.installer
        with:
          name: bornopata-windows-setup
          path: target/installer/*.exe
          if-no-files-found: error
