# One Linux job: fmt, dependency policy, clippy, the whole workspace test suite and the install script test.
# Actions are pinned to commits (the tag is in the trailing comment); Dependabot updates them weekly. Cargo runs with --locked.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      # audit.yml covers RustSec advisories; this adds licenses, sources and wildcard versions.
      # cargo-deny reads Cargo.lock itself and ignores --locked, so lock drift is caught by the --locked steps below.
      - name: Dependency licenses, sources and wildcards
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check licenses bans sources

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The Linux Server and the Fcitx5 shell tests return when the Server is ported to the Bangla Engine
      # (docs/plan/roadmap.md). Until then the Server is outside the workspace and these steps are off.

      - name: Validate Linux install scripts
        run: bash -n apps/linux/scripts/install.sh apps/linux/scripts/uninstall.sh

      - name: Test Linux installation
        shell: bash
        run: |
          mkdir -p target/ci-logs
          python3 apps/linux/tests/installation.py 2>&1 | tee target/ci-logs/linux-installation.log
