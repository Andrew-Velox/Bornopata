[workspace]
resolver = "3"
members = [
    "crates/borno-core",
    "crates/borno-transliteration",
    "crates/borno-learning",
    "crates/borno-lm",
    "crates/borno-format",
    "crates/borno-dictionary",
    "crates/borno-emoji",
    "crates/borno-gloss",
    "crates/bamboo-slip",
    "crates/borno-render",
    "crates/borno-panel",
    "crates/borno-platform",
    "crates/borno-server",
    "apps/cli",
    "apps/linux/server",
    "apps/settings",
    "tools/corpus-text",
    "tools/dict-build",
    "tools/lm-build",
    "tools/gloss-build",
    "tools/emoji-build",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Internal crates
borno-core = { path = "crates/borno-core" }
borno-transliteration = { path = "crates/borno-transliteration" }
borno-learning = { path = "crates/borno-learning" }
borno-platform = { path = "crates/borno-platform" }
borno-lm = { path = "crates/borno-lm" }
borno-corpus-text = { path = "tools/corpus-text" }
borno-format = { path = "crates/borno-format" }
borno-dictionary = { path = "crates/borno-dictionary" }
borno-gloss = { path = "crates/borno-gloss" }
borno-emoji = { path = "crates/borno-emoji" }
bamboo-slip = { path = "crates/bamboo-slip" }
borno-render = { path = "crates/borno-render" }
borno-panel = { path = "crates/borno-panel" }
borno-server = { path = "crates/borno-server" }
# External versions are pinned here; member crates use `xxx.workspace = true`
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = "0.25"
# Finite state transducer for the dictionary key index (MIT / Unlicense)
fst = "0.4.7"
# Unicode normalization of corpus text
unicode-normalization = "0.1.24"

# Self-drawn candidate window: rasterizer, text, layout
tiny-skia = "0.12.0"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
zeno = { version = "0.3.3", default-features = false }
# Window host of the settings program (bamboo-slip `host` feature)
winit = "0.30.13"
softbuffer = "0.4.8"
arboard = { version = "3.6.1", default-features = false }
taffy = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
# Fast string-keyed hash tables for hot lookups (word counts, language model, personal bigram)
foldhash = "0.2.0"
# .bnd data container: opened with mmap, structs read without copying
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

# Debug builds (and so every `cargo test`) keep line numbers for backtraces but no variable information, and none at all
# for dependencies: the debug directory had grown to 76 GB, and linking that much debug info is what made test runs heavy.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release binaries are about a third smaller with these (12 MB to 8 MB each); panic stays unwind so a crash in the window thread cannot take typing down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# cosmic-text with its shaping moved to harfrust 0.14, which forms Bengali conjuncts correctly (vendor/cosmic-text).
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
