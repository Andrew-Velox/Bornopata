# Third-party license notices for the release (cargo about generate about.hbs). The accepted list is the one in
# deny.toml, which CI enforces; this only has to name them again for cargo-about.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "MPL-2.0",
    "CC0-1.0",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
