[package]
name = "borno-linux-server"
description = "Linux Server: owns the Bangla engines and serves the Fcitx5 plugin over a Unix socket"
version = "0.1.0-alpha.3"
edition.workspace = true
license.workspace = true

[[bin]]
name = "borno-linux-server"
path = "src/main.rs"

[dependencies]
borno-core.workspace = true
borno-emoji.workspace = true
borno-panel.workspace = true
borno-platform.workspace = true
borno-render.workspace = true
borno-server.workspace = true
borno-transliteration.workspace = true
libc = "0.2.189"
memmap2.workspace = true
serde.workspace = true
rustix = { version = "1.1.5", features = ["fs", "net"] }
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
borno-dictionary.workspace = true
borno-format.workspace = true
borno-gloss.workspace = true
borno-learning.workspace = true
borno-lm.workspace = true
serde_json.workspace = true
