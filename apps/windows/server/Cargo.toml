[package]
name = "borno-windows-server"
description = "Windows Server: owns the Bangla engines and serves the text service DLL over a named pipe, and draws the candidate window"
version = "0.1.0-alpha.3-dev"
edition.workspace = true
license.workspace = true

[[bin]]
name = "bornopata-server"
path = "src/main.rs"

[dependencies]
borno-platform.workspace = true
borno-render.workspace = true
borno-server.workspace = true
borno-window.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
