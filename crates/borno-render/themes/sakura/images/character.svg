<svg xmlns="http://www.w3.org/2000/svg" width="137" height="150" viewBox="0 0 137 150">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffb3d9"/>
      <stop offset="0.55" stop-color="#e9a5e6"/>
      <stop offset="1" stop-color="#b9a0f2"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08fc4"/>
      <stop offset="1" stop-color="#c78be8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1ea"/>
      <stop offset="1" stop-color="#ffdccf"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4fc4"/>
      <stop offset="0.6" stop-color="#b072e6"/>
      <stop offset="1" stop-color="#f3a6e4"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#efe3fa"/>
      <stop offset="1" stop-color="#efe3fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b9a4f"/>
      <stop offset="1" stop-color="#53cc7a"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(2,4) scale(0.84)">

  <!-- twin tails behind everything -->
  <path d="M30,50 C4,52 -2,92 10,124 C13,132 22,130 23,122 C24,104 30,88 42,74 Z" fill="url(#hairDark)"/>
  <path d="M14,98 C16,110 18,118 17,126" stroke="#f7b3e0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- body: a little hoodie behind the window edge -->
  <path d="M34,100 C34,88 46,82 64,82 C82,82 94,88 94,100 L96,150 L32,150 Z" fill="url(#hood)"/>
  <path d="M52,84 C56,94 72,94 76,84 C72,100 56,100 52,84 Z" fill="#d9c4ef"/>
  <path d="M64,92 L64,112" stroke="#d9c4ef" stroke-width="2" stroke-linecap="round"/>
  <circle cx="58" cy="114" r="2.2" fill="#c9b3e8"/><circle cx="70" cy="114" r="2.2" fill="#c9b3e8"/>

  <!-- head -->
  <ellipse cx="64" cy="50" rx="35" ry="33" fill="url(#skin)"/>
  <!-- hair mass over the head -->
  <path d="M26,52 C24,22 44,8 66,8 C90,8 106,24 102,54 C98,40 92,34 84,32 C74,40 56,40 44,32 C36,36 30,42 26,52 Z" fill="url(#hair)"/>
  <!-- side locks -->
  <path d="M28,50 C24,62 26,78 32,90 C36,80 36,66 36,54 Z" fill="url(#hair)"/>
  <path d="M100,50 C104,62 102,78 96,90 C92,80 92,66 92,54 Z" fill="url(#hair)"/>
  <!-- bangs -->
  <path d="M38,34 C44,46 50,46 56,34 C58,46 66,48 70,34 C74,46 82,46 88,34 C84,26 76,22 64,22 C52,22 42,26 38,34 Z" fill="url(#hair)"/>
  <path d="M44,30 C54,24 74,24 86,30" stroke="#ffe3f3" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- eyes -->
  <g>
    <ellipse cx="49" cy="58" rx="8" ry="10" fill="url(#eye)"/>
    <ellipse cx="79" cy="58" rx="8" ry="10" fill="url(#eye)"/>
    <ellipse cx="49" cy="59" rx="4" ry="6" fill="#3d2a86" opacity="0.55"/>
    <ellipse cx="79" cy="59" rx="4" ry="6" fill="#3d2a86" opacity="0.55"/>
    <circle cx="52" cy="54" r="3.2" fill="#ffffff"/><circle cx="82" cy="54" r="3.2" fill="#ffffff"/>
    <circle cx="46.5" cy="62" r="1.6" fill="#ffffff" opacity="0.9"/><circle cx="76.5" cy="62" r="1.6" fill="#ffffff" opacity="0.9"/>
    <path d="M40,50 C44,45 54,45 57,50" stroke="#5a3d7a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M71,50 C74,45 84,45 88,50" stroke="#5a3d7a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- blush, nose, mouth -->
  <ellipse cx="38" cy="68" rx="7" ry="4.5" fill="url(#blush)"/>
  <ellipse cx="90" cy="68" rx="7" ry="4.5" fill="url(#blush)"/>
  <path d="M63,67 L65,67" stroke="#e9a79a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,72 C61,76 67,76 70,72" stroke="#d96b86" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M61,73.5 C62.5,76.5 65.5,76.5 67,73.5 Z" fill="#ff9db4"/>

  <!-- leaf hairpin: the Bornopata leaves -->
  <g transform="translate(88,24) rotate(24)">
    <path d="M0,0 C-2,-12 6,-22 18,-24 C20,-12 12,-2 0,0 Z" fill="url(#leaf)"/>
    <path d="M1,-1 C6,-9 11,-15 17,-22" stroke="#d9f5e2" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M0,0 C8,2 18,-2 22,-10 C14,-12 4,-10 0,0 Z" fill="#7bd99a"/>
  </g>
  <!-- small pink hair bow on the other side -->
  <g transform="translate(34,26) rotate(-14)">
    <path d="M0,0 C-8,-7 -14,-2 -12,5 C-9,9 -3,6 0,0 Z" fill="#ff7fb5"/>
    <path d="M0,0 C8,-7 14,-2 12,5 C9,9 3,6 0,0 Z" fill="#ff7fb5"/>
    <circle cx="0" cy="0" r="3.4" fill="#ffc2dc"/>
  </g>

  <!-- hands resting on the window edge -->
  <g>
    <ellipse cx="40" cy="80" rx="9" ry="7" fill="url(#skin)"/>
    <ellipse cx="88" cy="80" rx="9" ry="7" fill="url(#skin)"/>
    <path d="M31,84 C34,88 46,88 49,84" stroke="#ffcfc0" stroke-width="1.2" fill="none"/>
    <path d="M79,84 C82,88 94,88 97,84" stroke="#ffcfc0" stroke-width="1.2" fill="none"/>
    <path d="M30,82 C34,74 46,74 50,82 C44,88 36,88 30,82 Z" fill="none"/>
  </g>
  </g>
</svg>
