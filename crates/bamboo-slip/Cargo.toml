[package]
name = "bamboo-slip"
description = "Self-drawn UI engine: scene tree, layout, text and animation to a bitmap"
version.workspace = true
edition.workspace = true
# Dual-licensed upstream (GPL-3.0-or-later or a commercial license, see LICENSE.md). Bornopata uses and
# distributes it under the GPL side only.
license = "GPL-3.0-or-later"

[dependencies]
tiny-skia.workspace = true
# SVG images: parsed and rasterized into the same tiny-skia bitmaps; no SVG text, no system fonts, no embedded bitmaps
resvg = { version = "0.48.1", default-features = false }
cosmic-text.workspace = true
zeno.workspace = true
thiserror.workspace = true
tracing.workspace = true
taffy.workspace = true
serde.workspace = true
# Only to tell whether a font has outlines that can be rasterized; same version as fontdb uses
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

# Window host (the `host` feature)
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }

[features]
host = ["dep:winit", "dep:softbuffer", "dep:arboard"]

[[example]]
name = "window"
required-features = ["host"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
